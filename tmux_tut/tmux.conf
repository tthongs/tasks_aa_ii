# ==============================================================================
# Modern & Sensible Starter tmux.conf
# ==============================================================================
# To test with this file without modifying ~/.tmux.conf:
#   tmux -f ./tmux.conf
#
# To install as your personal config:
#   cp ./tmux.conf ~/.tmux.conf
#   tmux source-file ~/.tmux.conf (or press <Prefix> + r inside tmux)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. General Settings
# ------------------------------------------------------------------------------
# Enable 24-bit true color and italics support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Reduce escape key delay to 0ms (vital for Vim/Neovim users)
set -s escape-time 0

# Increase scrollback buffer size (default is 2000)
set -g history-limit 50000

# Increase tmux message display duration (in ms)
set -g display-time 2000

# Refresh status line more frequently (every 5 seconds)
set -g status-interval 5

# Start window and pane indexing at 1 instead of 0 for easier keyboard reach
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# Enable mouse mode (clickable windows, panes, resizable panes, mouse scrolling)
set -g mouse on

# Focus events enabled for terminals that support them
set -g focus-events on

# ------------------------------------------------------------------------------
# 2. Key Bindings & Ergonomics
# ------------------------------------------------------------------------------
# (Optional) Remap prefix key from Ctrl-b to Ctrl-a
# Uncomment the two lines below if you prefer Ctrl-a:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload configuration easily with <Prefix> + r
bind r source-file ~/.tmux.conf \; display-message " Config reloaded!"

# Split panes using intuitive keys and open in current working directory
# | for horizontal split (columns side-by-side)
# - for vertical split (rows stacked)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Open new windows in the current working directory
bind c new-window -c "#{pane_current_path}"

# Switch panes using Vim-style directional keys without prefix (Alt + h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Switch panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + Shift + H/J/K/L (repeatable with -r)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Toggle pane zoom (maximize / restore) with <Prefix> + m
bind m resize-pane -Z

# Switch windows using Alt + Left / Alt + Right
bind -n M-Left previous-window
bind -n M-Right next-window

# ------------------------------------------------------------------------------
# 3. Vi Copy Mode
# ------------------------------------------------------------------------------
# Use vi keys in copy/scrollback mode
setw -g mode-keys vi

# Better copy-mode keys:
# 'v' starts selection, 'y' copies to system clipboard (via xclip / wl-copy if available)
bind -T copy-mode-vi v send -X begin-selection

# Copy to clipboard on Linux (Wayland or X11)
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"' \
  'if-shell "command -v xclip >/dev/null 2>&1" \
     "bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"xclip -selection clipboard -in\"" \
     "bind -T copy-mode-vi y send -X copy-selection-and-cancel"'

# ------------------------------------------------------------------------------
# 4. Status Bar & Aesthetics
# ------------------------------------------------------------------------------
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Left status: Session name
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold]  #S #[bg=#1e1e2e] "

# Right status: Hostname, Time, Date
set -g status-right-length 100
set -g status-right "#[fg=#a6adc8] %H:%M | %d-%b-%y #[bg=#a6e3a1,fg=#11111b,bold] #h "

# Window status formatting
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#6c7086,bg=#181825] #I:#W "
setw -g window-status-current-format "#[fg=#cdd6f4,bg=#313244,bold] #I:#W* "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
